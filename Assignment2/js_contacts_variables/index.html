<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>
    <h1>Contact List</h1>
<!--The table element represents the entire list-->
    <table border="1" cellpadding="8">
        <!--thead is table header-->
        <thead>
            <!--one line-->
            <tr>
                <!--header grid-->
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <!--a grid-->
                <td id="firstContactName"></td>
                <td id="firstContactPhone"></td>
                <td id="firstContactEmail"></td>
            </tr>
            <tr>
                <td id="lastContactName"></td>
                <td id="lastContactPhone"></td>
                <td id="lastContactEmail"></td>
            </tr>
        </tbody>
    </table>
    <script src="Script.js"></script>
</body>
</html>
